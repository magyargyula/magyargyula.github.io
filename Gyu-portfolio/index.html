<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Magyar Gyula portfólió: Operations / Office Coordinator, back office és adminisztratív koordináció. Önéletrajz és motivációs levél letölthető.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/logo.png">
<meta property="og:title" content="Magyar Gyula Portfólió">
<meta property="og:description" content="Operations / Office Coordinator, back office és adminisztratív koordináció.">
<meta property="og:image" content="assets/hero.jpg">
<meta property="og:type" content="website">
<title>Magyar Gyula Portfólió</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F7; --bg2:#FFFFFF; --surface:#FFFFFF; --surface2:#EDF0F3;
  --line:#CBD4DE; --line-soft:#DFE5EB;
  --ink:#122338; --ink2:#3B4F66; --muted:#6C7F93;
  --accent:#9A5B06; --accent2:#B9740F; --accent-soft:rgba(154,91,6,.10);
  --glow:rgba(154,91,6,.11); --logoink:#0B1E3D;
  --shadow:0 1px 2px rgba(18,35,56,.05),0 16px 38px -22px rgba(18,35,56,.32);
  --maxw:1140px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1826; --bg2:#0E1F30; --surface:#112436; --surface2:#162C40;
    --line:#223B52; --line-soft:#1A3047;
    --ink:#E9EFF6; --ink2:#BAC9D8; --muted:#8398AE;
    --accent:#E9A93F; --accent2:#FFC470; --accent-soft:rgba(233,169,63,.13);
    --glow:rgba(233,169,63,.20); --logoink:#EFEADF;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 20px 46px -26px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1826; --bg2:#0E1F30; --surface:#112436; --surface2:#162C40;
  --line:#223B52; --line-soft:#1A3047;
  --ink:#E9EFF6; --ink2:#BAC9D8; --muted:#8398AE;
  --accent:#E9A93F; --accent2:#FFC470; --accent-soft:rgba(233,169,63,.13);
  --glow:rgba(233,169,63,.20); --logoink:#EFEADF;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 20px 46px -26px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16.5px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(52rem 34rem at 82% -6%, var(--glow), transparent 68%),
    radial-gradient(44rem 30rem at 6% 34%, var(--accent-soft), transparent 70%);
}
h1,h2,h3{font-family:Newsreader,Georgia,"Times New Roman",serif;text-wrap:balance;margin:0;font-weight:500}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 30px;position:relative;z-index:1}
.label{font-size:11.5px;font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--accent)}

/* ---------- fejléc ---------- */
header{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(140%) blur(12px);
  border-bottom:1px solid var(--line-soft);
}
.bar{display:flex;align-items:center;gap:22px;height:74px}
.logolink{flex:none;display:flex;align-items:center;text-decoration:none}
.logo{
  height:34px;width:auto;display:block;color:var(--logoink);
  transition:transform .4s cubic-bezier(.22,.9,.3,1),color .3s ease,opacity .3s ease;
}
.logolink:hover .logo{transform:translateY(-1.5px) scale(1.04);color:var(--accent)}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto;min-width:0}
.brand b{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:18px;letter-spacing:-.005em}
.brand span{font-size:10.5px;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
nav.links{display:flex;gap:24px}
nav.links a{font-size:14px;color:var(--ink2);text-decoration:none;padding:6px 0;position:relative;white-space:nowrap}
nav.links a::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:1px;background:var(--accent);transition:right .28s ease}
nav.links a:hover{color:var(--ink)}
nav.links a:hover::after{right:0}

.ctrl{display:flex;align-items:center;gap:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{
  appearance:none;border:0;background:transparent;cursor:pointer;font-family:inherit;
  font-size:11.5px;font-weight:600;letter-spacing:.1em;color:var(--muted);padding:8px 11px;
  transition:color .18s,background .18s;
}
.seg button[aria-pressed="true"]{background:var(--accent);color:#FFF}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0B1826}
.iconbtn{
  width:36px;height:36px;flex:none;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink2);
  transition:color .18s,border-color .18s;
}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
.menubtn{display:none}

/* ---------- hero ---------- */
.hero{padding:82px 0 88px;display:grid;grid-template-columns:1.12fr .88fr;gap:60px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;margin-bottom:26px}
.dot{width:6px;height:6px;border-radius:99px;background:var(--accent);animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
h1.name{font-size:clamp(42px,6.4vw,72px);line-height:1.04;letter-spacing:-.018em;font-weight:500}
.underline{height:2px;width:0;background:var(--accent);margin:18px 0 20px;animation:draw 1.1s cubic-bezier(.22,.9,.3,1) .25s forwards}
@keyframes draw{to{width:92px}}
p.tagline{font-size:15.5px;font-weight:600;letter-spacing:.005em;color:var(--accent);margin:0 0 18px;max-width:40ch}
p.lead{font-size:17.5px;color:var(--ink2);max-width:54ch;margin:0 0 30px}
.facts{display:flex;flex-wrap:wrap;gap:0 26px;margin-bottom:34px}
.fact{font-size:13.5px;color:var(--ink2);padding-right:26px;border-right:1px solid var(--line);line-height:1.5}
.fact:last-child{border-right:0;padding-right:0}
.fact b{display:block;font-weight:600;color:var(--ink);font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;cursor:pointer;font-family:inherit;
  font-size:14.5px;font-weight:600;padding:13px 23px;border-radius:7px;border:1px solid transparent;transition:.2s}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);color:#FFF}
:root[data-theme="dark"] .btn.primary{color:#0B1826}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}

/* hero kép - keret nélküli kivágás, egérkövetéses dőléssel */
.framewrap{display:grid;place-items:center;perspective:1100px}
.frame{position:relative;width:min(340px,78vw);transform-style:preserve-3d;
  transform:rotateX(0deg) rotateY(0deg);transition:transform .5s cubic-bezier(.22,.9,.3,1);will-change:transform}
.aura{position:absolute;left:50%;top:56%;width:145%;aspect-ratio:1/1;border-radius:50%;
  transform:translate(-50%,-50%) translateZ(-50px);
  background:radial-gradient(circle at 50% 42%,var(--glow),transparent 68%);
  animation:aura 9s ease-in-out infinite;pointer-events:none}
@keyframes aura{0%,100%{transform:translate(-50%,-50%) translateZ(-50px) scale(1);opacity:.85}
  50%{transform:translate(-50%,-50%) translateZ(-50px) scale(1.08);opacity:1}}
.floor{position:absolute;left:50%;bottom:2%;width:58%;height:22px;border-radius:50%;
  transform:translate(-50%,0) translateZ(-30px);
  background:radial-gradient(ellipse at center,color-mix(in srgb,var(--ink) 26%,transparent),transparent 72%);
  filter:blur(7px);pointer-events:none}
.heroimg{position:relative;z-index:1;width:100%;transform:translateZ(24px)}
.heroimg img{
  width:100%;height:auto;display:block;
  filter:contrast(1.06) saturate(1.05) drop-shadow(0 22px 26px rgba(0,0,0,.28));
}
.ph{color:var(--muted);font-size:12px;letter-spacing:.04em;line-height:1.95;padding:0 26px}
.ph strong{display:block;color:var(--ink2);font-size:11.5px;font-weight:600;letter-spacing:.16em;margin-bottom:6px}

/* ---------- szekciók ---------- */
section{padding:70px 0;border-top:1px solid var(--line-soft);position:relative;z-index:1}
.slabel{margin-bottom:16px}
h2{font-size:clamp(27px,3.4vw,38px);letter-spacing:-.012em;margin-bottom:30px;max-width:24ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:52px}
.prose p{color:var(--ink2);margin:0 0 16px;max-width:62ch}
.prose p:last-child{margin-bottom:0}

/* listák */
.colhead{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:8px}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line-soft);
  font-size:15.5px;color:var(--ink2)}
ul.plain li:last-child{border-bottom:0}
ul.plain li::before{content:"";flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:var(--accent)}

/* idővonal */
.tl{position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1px;background:var(--line)}
.job{position:relative;padding:0 0 38px}
.job:last-child{padding-bottom:0}
.job::before{content:"";position:absolute;left:-34px;top:9px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--line);transition:border-color .2s,box-shadow .2s}
.job:hover::before{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.job .yr{font-size:12.5px;font-weight:600;letter-spacing:.1em;color:var(--accent);margin-bottom:6px}
.job h3{font-size:21px;font-weight:600;letter-spacing:-.008em}
.job .org{font-size:14px;color:var(--muted);margin:3px 0 12px}
.job ul{margin:0;padding-left:19px;color:var(--ink2);font-size:15px}
.job ul li{margin-bottom:6px}
.job ul li::marker{color:var(--accent)}
.win{display:block;margin-top:12px;font-size:14.5px;color:var(--ink);background:var(--accent-soft);
  border-left:2px solid var(--accent);padding:10px 15px;border-radius:0 5px 5px 0}

/* tanulmányok */
.edu{border-top:1px solid var(--line)}
.edu .item{display:grid;grid-template-columns:1fr 170px;gap:26px;padding:20px 2px;border-bottom:1px solid var(--line-soft)}
.edu h3{font-size:17.5px;font-weight:600;letter-spacing:-.005em}
.edu p{margin:6px 0 0;font-size:14.5px;color:var(--muted);max-width:70ch}
.edu .d{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--accent);text-align:right;padding-top:4px}

/* dokumentumok */
.docgrid{display:grid;grid-template-columns:1fr 1fr;gap:38px}
.file{display:flex;align-items:center;gap:15px;text-decoration:none;padding:15px 17px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);margin-bottom:10px;transition:.2s}
.file:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.file .ext{font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--accent);
  border:1px solid var(--accent);border-radius:4px;padding:4px 6px;flex:none}
.file .t{flex:1;min-width:0}
.file .t b{display:block;font-size:15px;font-weight:600}
.file .t span{font-size:12.5px;color:var(--muted)}
.file .arw{color:var(--muted);transition:.2s;flex:none;display:flex}
.file:hover .arw{color:var(--accent);transform:translateY(2px)}
.file .arw svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.notice{display:none;margin-top:10px;font-size:14px;color:var(--ink2);background:var(--accent-soft);
  border-left:2px solid var(--accent);padding:12px 15px;border-radius:0 5px 5px 0}
.notice.on{display:block}

/* kapcsolat */
.cline{display:flex;align-items:baseline;gap:16px;padding:16px 0;border-bottom:1px solid var(--line-soft);text-decoration:none}
.cline .lb{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);width:86px;flex:none}
.cline .vl{font-size:16px;color:var(--ink);word-break:break-word}
a.cline:hover .vl{color:var(--accent)}
.cline.placeholder .vl{color:var(--muted)}

footer{border-top:1px solid var(--line-soft);padding:32px 0 48px;position:relative;z-index:1}
.foot{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.rise{animation:rise .75s cubic-bezier(.22,.9,.3,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

@media (max-width:940px){
  .hero{grid-template-columns:1fr;gap:42px;padding:54px 0 66px}
  .framewrap{order:-1;justify-self:start}
  .two,.docgrid{grid-template-columns:1fr;gap:34px}
  .edu .item{grid-template-columns:1fr;gap:6px}
  .edu .d{text-align:left;padding-top:0}
  nav.links{display:none}
  nav.links.open{display:flex;position:absolute;top:74px;left:0;right:0;flex-direction:column;gap:0;
    background:var(--bg2);border-bottom:1px solid var(--line);padding:6px 30px 18px}
  nav.links.open a{padding:12px 0;border-bottom:1px solid var(--line-soft)}
  .menubtn{display:grid}
}
@media (max-width:560px){
  .wrap{padding:0 20px}
  .bar{gap:14px}
  .logo{height:30px}
  .brand{display:none}
  .logolink{margin-right:auto}
  .facts{gap:14px 0;flex-direction:column}
  .fact{border-right:0;padding-right:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .underline{width:92px}
}
</style>

const IDS = ["bemutatkozas","kompetenciak","tapasztalat","tanulmanyok","dokumentumok","kapcsolat"];
const SUN = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.3 4.3l1.6 1.6M18.1 18.1l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.3 19.7l1.6-1.6M18.1 5.9l1.6-1.6"/>';
const MOON = '<path d="M20 13.4A8.2 8.2 0 0 1 10.6 4a8.4 8.4 0 1 0 9.4 9.4Z"/>';
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
let lang = "hu";

function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  document.getElementById("themeIcon").innerHTML = t === "dark" ? SUN : MOON;
  try{ localStorage.setItem("gy-theme", t); }catch(e){}
}

function render(){
  const d = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.innerHTML = d[el.dataset.i18n] || ""; });

  document.getElementById("nav").innerHTML =
    d.nav.map((n,i)=>`<a href="#${IDS[i]}">${esc(n)}</a>`).join("");

  document.getElementById("facts").innerHTML =
    d.facts.map(f=>`<div class="fact"><b>${esc(f[0])}</b>${esc(f[1])}</div>`).join("");

  document.getElementById("skills").innerHTML = d.skills.map(s=>`<li>${esc(s)}</li>`).join("");
  document.getElementById("strengths").innerHTML = d.strengths.map(s=>`<li>${esc(s)}</li>`).join("");

  document.getElementById("tl").innerHTML = d.jobs.map(j=>`
    <article class="job">
      <div class="yr">${esc(j.yr)}</div>
      <h3>${esc(j.role)}</h3>
      <div class="org">${esc(j.org)}</div>
      <ul>${j.li.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      ${j.win ? `<span class="win">${esc(j.win)}</span>` : ""}
    </article>`).join("");

  document.getElementById("edu").innerHTML = d.edu.map(e=>`
    <div class="item">
      <div><h3>${esc(e[0])}</h3>${e[2]?`<p>${esc(e[2])}</p>`:""}</div>
      <div class="d">${esc(e[1])}</div>
    </div>`).join("");

  const arrow = '<span class="arw"><svg viewBox="0 0 24 24"><path d="M12 4v13m0 0 5-5m-5 5-5-5"/><path d="M5 20h14"/></svg></span>';
  const fileRow = f => `<a class="file" href="doc/${f[0]}" download>
      <span class="ext">DOCX</span>
      <span class="t"><b>${esc(f[1])}</b><span>${esc(f[0])}</span></span>${arrow}</a>`;
  document.getElementById("cvFiles").innerHTML = d.files.cv.map(fileRow).join("");
  document.getElementById("ltFiles").innerHTML = d.files.lt.map(fileRow).join("");

  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===lang)));
}

function setLang(l){
  lang = T[l] ? l : "hu";
  try{ localStorage.setItem("gy-lang", lang); }catch(e){}
  render();
}

document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));
document.getElementById("theme").addEventListener("click",()=>{
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
const nav = document.getElementById("nav"), menu = document.getElementById("menu");
menu.addEventListener("click",()=>{
  const open = nav.classList.toggle("open");
  menu.setAttribute("aria-expanded", String(open));
});
nav.addEventListener("click",e=>{
  if(e.target.tagName === "A"){ nav.classList.remove("open"); menu.setAttribute("aria-expanded","false"); }
});

(function(){
  const heroFrame = document.getElementById("heroFrame");
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(heroFrame && !reduceMotion && matchMedia("(hover: hover) and (pointer: fine)").matches){
    const framewrap = heroFrame.closest(".framewrap");
    const maxTilt = 12;
    framewrap.addEventListener("pointermove", e => {
      const r = heroFrame.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;
      const py = (e.clientY - r.top) / r.height;
      const rotY = (px - .5) * maxTilt * 2;
      const rotX = (.5 - py) * maxTilt * 2;
      heroFrame.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    });
    framewrap.addEventListener("pointerleave", () => {
      heroFrame.style.transform = "rotateX(0deg) rotateY(0deg)";
    });
  }

  let savedT = null, savedL = null;
  try{ savedT = localStorage.getItem("gy-theme"); savedL = localStorage.getItem("gy-lang"); }catch(e){}
  setTheme(savedT || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  const auto = (navigator.language || "hu").slice(0,2).toLowerCase();
  setLang(savedL || (T[auto] ? auto : "hu"));

  if(location.protocol === "http:" || location.protocol === "https:"){
    fetch("doc/Magyar_Gyula_Oneletrajz_HU.docx",{method:"HEAD"})
      .then(r=>{ if(!r.ok) document.getElementById("notice").classList.add("on"); })
      .catch(()=>document.getElementById("notice").classList.add("on"));
  }
})();
</script>
